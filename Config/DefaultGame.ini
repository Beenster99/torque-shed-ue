[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Torque Shed UE prototype
Description=One bike on 3 km of Buttertubs Pass

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Data")
; The bike's parts are loaded by path at run time, not referenced by the level, so cook them always.
+DirectoriesToAlwaysCook=(Path="/Game/Bike")
; Likewise the rider (loaded by path) and the Fab/Megascans assets the foliage and props load by path.
+DirectoriesToAlwaysCook=(Path="/Game/Rider")
+DirectoriesToAlwaysCook=(Path="/Game/Fab")
; The shed (Tools/ue_build_shed.py): its map and materials. Co-op opens it by path.
+DirectoriesToAlwaysCook=(Path="/Game/Shed")
; The co-op avatars (Tools/ue_metahumans.py): MetaHuman Blueprints spawned by path.
+DirectoriesToAlwaysCook=(Path="/Game/MetaHumans")
; Maps aren't cooked from DirectoriesToAlwaysCook: list both, or the packaged game can't open the shed.
+MapsToCook=(FilePath="/Game/Maps/Buttertubs")
+MapsToCook=(FilePath="/Game/Shed/Shed")

[TorqueCoop]
; Epic Online Services friend codes (Docs/coop.md). Needs the OnlineSubsystemEOS plugin and the
; product's IDs in a config kept out of Git; until then LAN and join by address work alone.
bUseEOS=False
