[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Shed/Shed.Shed
EditorStartupMap=/Game/Shed/Shed.Shed
GlobalDefaultGameMode=/Script/TorqueShedProto.TorqueGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; SM6 only: Nanite, Lumen and virtual shadow maps need it. With SM5 in the list the packaged game ran SM5.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen with hardware ray tracing, virtual shadow maps: the RTX 4090 path.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
; Lumen's surface cache, not hit lighting (the dearest kind): the game turns hit lighting on only with
; Cinematic reflections (FTorqueSettings::Apply, build 150).
r.Lumen.HardwareRayTracing.LightingMode=0
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
r.Nanite.ProjectEnabled=True
; Runtime virtual textures: the plants read the ground's colour from one (Tools/ue_build_level.py ground_rvt).
r.VirtualTextures=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.AllowStaticLighting=False
r.CustomDepth=3

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
r.VSync=0
; (build 152) Round 151 had 660-813 ms hitches with nothing of the ride's own in them: most likely shaders
; (PSOs) compiled the first time a material is seen. Precache each component's PSOs when it is made and
; only draw it once they are ready (a moment's pop-in instead of a freeze), and use the shader pipeline cache.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.ShaderPipelineCache.Enabled=1
; (build 150: the sun's shadow page detail is the shadow preset's again; a fixed -1 here outranked
; every preset)
; The avatars' hair as cards at every distance: up close the grooms switch to strands, which the
; Optimized/Medium MetaHumans don't have, so the hair vanished near the camera (round 125).
r.HairStrands.UseCardsInsteadOfStrands=1
r.HairStrands.LODMode=0

; Co-op (Source/TorqueShedProto/Coop, Docs/coop.md): a listen server, joined by address or found on the
; LAN through the Null online subsystem. EOS later replaces Null so friends join without port forwarding.
[OnlineSubsystem]
DefaultPlatformService=Null

[URL]
Port=7777

; Room for several riders' snapshots (about 4 KB/s each) on every link.
[/Script/Engine.Player]
ConfiguredInternetSpeed=200000
ConfiguredLanSpeed=200000

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=200000
MaxInternetClientRate=200000
