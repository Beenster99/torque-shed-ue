[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Shed/Shed.Shed
EditorStartupMap=/Game/Shed/Shed.Shed
GlobalDefaultGameMode=/Script/TorqueShedProto.TorqueGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; SM6 only: Nanite, Lumen and virtual shadow maps need it. With SM5 in the list the packaged game ran SM5.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen with hardware ray tracing, virtual shadow maps: the RTX 4090 path.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
r.Nanite.ProjectEnabled=True
; Runtime virtual textures: the plants read the ground's colour from one (Tools/ue_build_level.py ground_rvt).
r.VirtualTextures=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.AllowStaticLighting=False
r.CustomDepth=3

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
r.VSync=0
; Finer sun shadow pages: tree and wall shadows less blocky, for about 0.05 ms at 4K.
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1

; Co-op (Source/TorqueShedProto/Coop, Docs/coop.md): a listen server, joined by address or found on the
; LAN through the Null online subsystem. EOS later replaces Null so friends join without port forwarding.
[OnlineSubsystem]
DefaultPlatformService=Null

[URL]
Port=7777

; Room for several riders' snapshots (about 4 KB/s each) on every link.
[/Script/Engine.Player]
ConfiguredInternetSpeed=200000
ConfiguredLanSpeed=200000

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=200000
MaxInternetClientRate=200000
